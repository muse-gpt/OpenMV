[workspace]
resolver = "2"
members = ["crates/napi"]
default-members = ["crates/napi"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenMV Authors"]
repository = "https://github.com/nyar-os/OpenMV"

[workspace.dependencies]
serde_json = "1"
# Cross-repo git dependencies must pin the full 40-character revision.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "66f5d003fec85e28503968fd0a6a271beef0f389" }
# Song analysis and the shared error contract live in the neutral media tree.
# The revision is pinned to a full 40-character commit so this repo resolves
# exactly one upstream source.
media-audio = { git = "https://github.com/oovm/boost.rs.git", rev = "f7ec3506a8528bcb51d4002aecafc96d7d17051f" }
media-types = { git = "https://github.com/oovm/boost.rs.git", rev = "f7ec3506a8528bcb51d4002aecafc96d7d17051f" }

[profile.release]
lto = true
panic = "abort"
